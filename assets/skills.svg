<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150">
<defs>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FFF3B0"/><stop offset=".5" stop-color="#FFD700"/><stop offset="1" stop-color="#B8860B"/>
</linearGradient>
<linearGradient id="neonV" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFF3B0"/><stop offset=".5" stop-color="#FFD700"/><stop offset="1" stop-color="#8A6508"/>
</linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#2b2208"/><stop offset=".5" stop-color="#16110a"/><stop offset="1" stop-color="#0d0b07"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FFF3B0" stop-opacity=".75"/><stop offset=".5" stop-color="#FFD700" stop-opacity=".25"/>
  <stop offset="1" stop-color="#B8860B" stop-opacity=".75"/>
</linearGradient>
<linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
  <stop offset="0" stop-color="#FFF3B0"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B8860B"/>
  <animate attributeName="x1" values="-300;700;-300" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="0;1000;0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
    .chip{transform-box:fill-box;transform-origin:center;animation:pop .6s ease-out both,bob 4s ease-in-out infinite}
    </style></defs>
<rect width="900" height="150" rx="22" fill="url(#bg)"/><rect width="900" height="150" rx="22" fill="url(#sheen)"/><rect x="1" y="1" width="898" height="148" rx="21" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<text x="44" y="30" font-size="12" fill="#CDB46A" letter-spacing="2">LANGUAGES &amp; TECH</text>
<g class="chip" style="animation-delay:0.00s,0.0s"><rect x="48" y="46" width="152" height="58" rx="29" fill="#fff" fill-opacity=".06" stroke="url(#edge)" stroke-width="1.4"/><rect x="48" y="46" width="152" height="28" rx="14" fill="url(#sheen)"/><circle cx="76" cy="75" r="6" fill="#FFF3B0" filter="url(#glow)"/><text x="92" y="81" font-size="16" font-weight="600" fill="#FFF3D0">JavaScript</text></g><g class="chip" style="animation-delay:0.12s,0.5s"><rect x="218" y="46" width="170" height="58" rx="29" fill="#fff" fill-opacity=".06" stroke="url(#edge)" stroke-width="1.4"/><rect x="218" y="46" width="170" height="28" rx="14" fill="url(#sheen)"/><circle cx="246" cy="75" r="6" fill="#FFE98A" filter="url(#glow)"/><text x="262" y="81" font-size="16" font-weight="600" fill="#FFF3D0">Tailwind CSS</text></g><g class="chip" style="animation-delay:0.24s,1.0s"><rect x="406" y="46" width="170" height="58" rx="29" fill="#fff" fill-opacity=".06" stroke="url(#edge)" stroke-width="1.4"/><rect x="406" y="46" width="170" height="28" rx="14" fill="url(#sheen)"/><circle cx="434" cy="75" r="6" fill="#FFD700" filter="url(#glow)"/><text x="450" y="81" font-size="16" font-weight="600" fill="#FFF3D0">React + Vite</text></g><g class="chip" style="animation-delay:0.36s,1.5s"><rect x="594" y="46" width="116" height="58" rx="29" fill="#fff" fill-opacity=".06" stroke="url(#edge)" stroke-width="1.4"/><rect x="594" y="46" width="116" height="28" rx="14" fill="url(#sheen)"/><circle cx="622" cy="75" r="6" fill="#E6B422" filter="url(#glow)"/><text x="638" y="81" font-size="16" font-weight="600" fill="#FFF3D0">Python</text></g><g class="chip" style="animation-delay:0.48s,2.0s"><rect x="728" y="46" width="125" height="58" rx="29" fill="#fff" fill-opacity=".06" stroke="url(#edge)" stroke-width="1.4"/><rect x="728" y="46" width="125" height="28" rx="14" fill="url(#sheen)"/><circle cx="756" cy="75" r="6" fill="#B8860B" filter="url(#glow)"/><text x="772" y="81" font-size="16" font-weight="600" fill="#FFF3D0">Node.js</text></g>
</svg>