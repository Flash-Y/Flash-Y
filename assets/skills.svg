<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130">
<defs>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FFF3B0"/><stop offset=".5" stop-color="#FFD700"/><stop offset="1" stop-color="#B8860B"/>
</linearGradient>
<linearGradient id="neonV" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFF3B0"/><stop offset=".5" stop-color="#FFD700"/><stop offset="1" stop-color="#8A6508"/>
</linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#2b2208"/><stop offset=".5" stop-color="#16110a"/><stop offset="1" stop-color="#0d0b07"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FFF3B0" stop-opacity=".75"/><stop offset=".5" stop-color="#FFD700" stop-opacity=".25"/>
  <stop offset="1" stop-color="#B8860B" stop-opacity=".75"/>
</linearGradient>
<linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
  <stop offset="0" stop-color="#FFF3B0"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B8860B"/>
  <animate attributeName="x1" values="-300;700;-300" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="0;1000;0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;}</style></defs>
<rect width="900" height="130" rx="22" fill="url(#bg)"/><rect width="900" height="130" rx="22" fill="url(#sheen)"/><rect x="1" y="1" width="898" height="128" rx="21" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<text x="44" y="28" font-size="12" fill="#CDB46A" letter-spacing="2">LANGUAGES &amp; TECH</text>
<rect x="63" y="42" width="148" height="54" rx="27" fill="#fff" fill-opacity=".06" stroke="url(#edge)" stroke-width="1.4"/><rect x="63" y="42" width="148" height="26" rx="13" fill="url(#sheen)"/><text x="137" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#FFF3D0">JavaScript</text><rect x="227" y="42" width="168" height="54" rx="27" fill="#fff" fill-opacity=".06" stroke="url(#edge)" stroke-width="1.4"/><rect x="227" y="42" width="168" height="26" rx="13" fill="url(#sheen)"/><rect x="411" y="42" width="168" height="54" rx="27" fill="#fff" fill-opacity=".06" stroke="url(#edge)" stroke-width="1.4"/><rect x="411" y="42" width="168" height="26" rx="13" fill="url(#sheen)"/><text x="495" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#FFF3D0">React + Vite</text><rect x="595" y="42" width="108" height="54" rx="27" fill="#fff" fill-opacity=".06" stroke="url(#edge)" stroke-width="1.4"/><rect x="595" y="42" width="108" height="26" rx="13" fill="url(#sheen)"/><text x="649" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#FFF3D0">Python</text><rect x="719" y="42" width="118" height="54" rx="27" fill="#fff" fill-opacity=".06" stroke="url(#edge)" stroke-width="1.4"/><rect x="719" y="42" width="118" height="26" rx="13" fill="url(#sheen)"/><text x="778" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#FFF3D0">Node.js</text>
</svg>
